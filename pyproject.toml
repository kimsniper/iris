[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris"
version = "0.1.0"
description = "Research platform for classical, model-based, and learning-based control of self-balancing robots"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.0,<2",
  "mujoco>=3.2,<4",
  "numpy>=1.26,<3",
  "osqp>=0.6,<2",
  "PyYAML>=6,<7",
  "scipy>=1.12,<2",
  "stable-baselines3>=2.4,<3",
  "torch>=2.2"
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
